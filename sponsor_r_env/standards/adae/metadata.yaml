dataset: ADAE
class: OCCDS
purpose: Adverse event analysis dataset
packages: [dplyr]
modules: [teae.R]
depends_on_standards: [ADSL]
versions:
  - version: "1.0"
    file: ADAE_v1.R
    status: deprecated
    validated: true
    population: 'SAFFL == "Y"'
  - version: "2.0"
    file: ADAE_v2.R
    status: approved
    validated: true
    population: 'SAFFL == "Y"'
    anchors:
      population_filter:
        pattern: 'filter(ae1, SAFFL == "Y")'
        replacement: 'filter(ae1, {population})'
    module_behaviors:
      - capability: derive_teae
        field: teae_definition
        value: 'TRTEMFL = if_else(AESTDT >= trt_start, "Y", NA_character_)'
        target_file: modules/teae.R
        pattern: 'TRTEMFL = if_else(AESTDT >= trt_start, "Y", NA_character_)'
        replacement: '{teae_definition}'
